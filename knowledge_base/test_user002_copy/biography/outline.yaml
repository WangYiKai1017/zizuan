  summary: 去年冬天，我用老式收音机调频，调到一个模糊的短波台——像极了七十年前赵大哥教我听的第一个信号。孙子问我听什么，我说：‘听当年没说完的话。’原来人这一生，不是走向终点，而是把散落的频率，一一生生校准回来。
  confirmed_at: null
  written_at: null
