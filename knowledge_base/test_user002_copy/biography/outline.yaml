  summary: 我出生在硝烟将至的北方小村，父亲在学堂青砖缝里为我念《千字文》，母亲在麦场边教我捆稻穗。炮声渐近时，私塾关了门，可父亲仍点着油灯教我识字——那微光没照见太平，却照亮了我一生认得清自己是谁。
  confirmed_at: '2026-05-20T21:19:20.484913'
