  summary: 十四岁成婚那日，我还没摸过电键；三个月后，我坐在指挥部地窖里，耳中是炮弹呼啸，指尖是滴答跳动的摩尔斯电码。赵大哥手把手教我调频，首长拍我肩膀说‘稳住’——那一刻我才懂：战士不是扛枪的人，而是让命令穿过硝烟、抵达黎明的人。
  confirmed_at: null
  written_at: null
- id: ch03
  title: 驳壳枪与发报机之间
  life_stage: youth
  theme: 困境与韧性
  status: draft
  source_materials:
  - events/elderly/赵大哥教授使用驳壳枪射击.md
  - events/elderly/赵大哥缴获驳壳枪.md
  - events/elderly/参军成为通信兵.md
  - people/others/保卫排战士.md
  - timeline/life-events.md
  summary: 他们让我守在电台旁，不配枪，说‘报务员不用上阵’；可我执意学打驳壳枪，不是为杀敌，是为确认自己也能挡在前面。当第一颗子弹出膛震得我虎口发麻，我忽然明白：真正的韧性，是在被保护的位置上，依然选择挺直脊梁。
  confirmed_at: null
  written_at: null
- id: ch04
  title: 未寄出的家书
  life_stage: middle_age
