  - people/others/首长.md
  summary: 后来我成了带徒弟的报务组长，可再没写过一封完整的家书——不是没时间，是怕笔尖一软，就泄了十年战壕里攒下的硬气。父亲教我的‘敬惜字纸’，到头来，最敬重的字，是发出去再没回音的密电码。
  confirmed_at: null
  written_at: null
