- id: ch01
  title: 序曲：老槐树下的四合院
  life_stage: childhood
  theme: 童年记忆与乡土情怀
  status: written
  source_materials:
  - events/childhood/四合院家庭生活.md
  - people/others/爷爷.md
  - people/others/奶奶.md
  - timeline/life-events.md
  summary: 我的童年，从一座有老槐树的四合院开始。爷爷的故事、奶奶的槐花饼、院里的青砖灰瓦，都像老槐树的根一样深深扎进我的记忆里。那是我的整个世界，也是我所有温情的起点。
  confirmed_at: '2026-05-13T20:01:50.111632'
  written_at: '2026-05-13T20:02:17.998714'
- id: ch02
  title: 小芳和我的战争与和平
  life_stage: childhood
  theme: 手足情深与保护欲
  status: written
  source_materials:
  - events/childhood/小时候打架.md
  - people/others/小芳.md
  - people/family/母亲.md
  - events/childhood/槐花饼制作与分享.md
  summary: 我和妹妹小芳，是在打闹和分享中长大的。我为了她跟邻居胖墩打架，挨了母亲的责骂；我们又一起偷吃奶奶刚蒸好的槐花饼。那种又吵又闹、又甜又暖的日子，让我第一次明白了什么叫“哥哥”。
  confirmed_at: '2026-05-13T20:01:50.111654'
  written_at: '2026-05-13T20:02:58.299042'
- id: ch03
  title: 书声里的启蒙
  life_stage: childhood
  theme: 早期启蒙与求知萌芽
  status: written
  source_materials:
  - events/childhood/幼年跟随父亲在学堂旁听.md
  - people/family/父亲.md
  - people/others/用户.md
  summary: 父亲在学堂教书，我常跟在他身后去旁听。那些朗朗书声、墨香和粉笔灰，是我最熟悉的童年气味。我不一定全听得懂，但我知道，那是一扇通往更大世界的门。父亲没有逼我，他只是打开了那扇门，然后等我走进去。
  confirmed_at: '2026-05-13T20:01:50.111658'
  written_at: '2026-05-13T20:03:27.226753'
- id: ch04
  title: 回望：那一树槐花，一生牵挂
  life_stage: elderly
  theme: 家族记忆的承载与传承
  status: written
  source_materials:
  - events/childhood/四合院家庭生活.md
  - events/childhood/槐花饼制作与分享.md
  - people/others/奶奶.md
  - people/others/爷爷.md
  summary: 如今老了，闭上眼睛，最清晰的还是那棵老槐树。槐花年年开，可做饼的人已经不在了，听故事的孩子也走远了。但那些甜、那些暖，却像槐花的香气一样，飘了一辈子，从未散去。这就是我的根，我的来处。
  confirmed_at: '2026-05-13T20:01:50.111660'
  written_at: '2026-05-13T20:03:55.723353'
